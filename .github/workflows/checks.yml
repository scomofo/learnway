name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in *.mjs; do node --check "$file"; done
      - name: Regression tests
        run: node --test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Desktop browser acceptance (mocked Gemini)
        env:
          LEARNWAY_SCREENSHOT: /tmp/learnway-acceptance.png
        run: |
          node serve.mjs > /tmp/learnway-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e 'const url="http://127.0.0.1:8130"; (async()=>{ for(let i=0;i<50;i++){ try{ if((await fetch(url)).ok) return; }catch{} await new Promise(r=>setTimeout(r,100)); } process.exit(1); })();'
          node scripts/browser-acceptance.mjs
      - name: Upload acceptance screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-acceptance
          path: /tmp/learnway-acceptance.png

